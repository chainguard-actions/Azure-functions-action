name: Test slot-name mismatching publish profile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-name: myfuncapp
          slot-name: staging
          package: tests/fixtures/funcapp
          publish-profile: |
            <publishData>
              <publishProfile profileName="myfuncapp - Zip Deploy" publishMethod="ZipDeploy" publishUrl="myfuncapp.scm.azurewebsites.net:443" userName="$myfuncapp" userPWD="notarealpassword" destinationAppUrl="https://myfuncapp.azurewebsites.net" />
            </publishData>
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          APP_URL: ${{ steps.action.outputs.app-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "app-url: $APP_URL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because publish profile is for production, not slot 'staging'"
            exit 1
          fi
          if [ -n "$APP_URL" ]; then
            echo "FAIL: app-url should not be set on failure"
            exit 1
          fi
          echo "PASS"
