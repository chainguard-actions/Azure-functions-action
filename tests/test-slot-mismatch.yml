name: Test slot-name mismatch with publish-profile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare package folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/func-pkg"
          echo '{"version":"2.0"}' > "$GITHUB_WORKSPACE/func-pkg/host.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-name: my-test-function-app
          slot-name: staging
          package: ./func-pkg
          publish-profile: >-
            <publishData><publishProfile profileName="zip" publishMethod="ZipDeploy"
            publishUrl="my-test-function-app.scm.azurewebsites.net:443" userName="$my-test-function-app"
            userPWD="notarealpassword" destinationAppUrl="https://my-test-function-app.azurewebsites.net" /></publishData>
      - name: Assert action failed on slot mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
          APP_URL: ${{ steps.action.outputs.app-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "app-url: $APP_URL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when publish-profile does not match slot-name"
            exit 1
          fi
          if [ -n "$APP_URL" ]; then
            echo "FAIL: app-url should not be set"
            exit 1
          fi
          echo "PASS"
