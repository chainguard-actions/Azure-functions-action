name: Test existing AZURE_HTTP_USER_AGENT is prefixed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          AZURE_HTTP_USER_AGENT: my-custom-prefix
        with:
          app-name: my-test-function-app
          package: ./does-not-exist-package-dir
      - name: Assert user agent keeps prefix
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "AZURE_HTTP_USER_AGENT: $AZURE_HTTP_USER_AGENT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent package path"
            exit 1
          fi
          case "$AZURE_HTTP_USER_AGENT" in
            my-custom-prefix+GITHUBACTIONS_DeployFunctionAppToAzure_*) ;;
            *) echo "FAIL: expected prefix 'my-custom-prefix+' in user agent"; exit 1 ;;
          esac
          echo "PASS"
