name: Test sku flexconsumption with unusable publish profile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/func-pkg"
          echo '{"version":"2.0"}' > "$GITHUB_WORKSPACE/func-pkg/host.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-name: my-test-function-app
          package: func-pkg
          sku: flexconsumption
          remote-build: 'false'
          publish-profile: >-
            <publishData><publishProfile profileName="ftp" publishMethod="FTP"
            publishUrl="ftp://example.invalid" userName="u" userPWD="p"
            destinationAppUrl="https://example.invalid" /></publishData>
      - name: Assert action failed without deploying
        env:
          OUTCOME: ${{ steps.action.outcome }}
          APP_URL: ${{ steps.action.outputs.app-url }}
          PACKAGE_URL: ${{ steps.action.outputs.package-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "app-url: $APP_URL"
          echo "package-url: $PACKAGE_URL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for flexconsumption deploy with unusable publish profile"
            exit 1
          fi
          if [ -n "$PACKAGE_URL" ]; then
            echo "FAIL: package-url should not be set"
            exit 1
          fi
          echo "PASS"
