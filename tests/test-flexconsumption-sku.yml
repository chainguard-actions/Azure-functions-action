name: Test flexconsumption sku with unreachable publish profile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-name: my-test-func-app
          package: tests/fixtures/funcapp
          sku: flexconsumption
          remote-build: 'true'
          publish-profile: |
            <publishData>
              <publishProfile profileName="ftp" publishMethod="FTP" publishUrl="ftp://example.invalid/site" userName="u" userPWD="p" destinationAppUrl="https://example.invalid" />
            </publishData>
      - name: Assert action failed without outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          APP_URL: ${{ steps.action.outputs.app-url }}
          PACKAGE_URL: ${{ steps.action.outputs.package-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "app-url: $APP_URL"
          echo "package-url: $PACKAGE_URL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure deploying to an invalid flexconsumption target"
            exit 1
          fi
          if [ -n "$APP_URL" ] || [ -n "$PACKAGE_URL" ]; then
            echo "FAIL: outputs should not be set on failure"
            exit 1
          fi
          echo "PASS"
