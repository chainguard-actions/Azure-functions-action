name: Test missing package path fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-name: my-test-func-app
          package: does/not/exist/anywhere
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          APP_URL: ${{ steps.action.outputs.app-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "app-url: $APP_URL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent package path"
            exit 1
          fi
          if [ -n "$APP_URL" ]; then
            echo "FAIL: app-url should not be set on failure"
            exit 1
          fi
          echo "PASS"
      - name: Assert user agent was exported
        run: |
          echo "AZURE_HTTP_USER_AGENT: $AZURE_HTTP_USER_AGENT"
          case "$AZURE_HTTP_USER_AGENT" in
            *GITHUBACTIONS_DeployFunctionAppToAzure_*) echo "PASS" ;;
            *) echo "FAIL: AZURE_HTTP_USER_AGENT not exported as expected"; exit 1 ;;
          esac
