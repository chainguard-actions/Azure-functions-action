name: Test missing package path fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-name: my-test-function-app
          package: ./does-not-exist-package-dir
      - name: Assert action failed and exported user agent
        env:
          OUTCOME: ${{ steps.action.outcome }}
          APP_URL: ${{ steps.action.outputs.app-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "app-url: $APP_URL"
          echo "AZURE_HTTP_USER_AGENT: $AZURE_HTTP_USER_AGENT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent package path"
            exit 1
          fi
          if [ -n "$APP_URL" ]; then
            echo "FAIL: app-url should not be set"
            exit 1
          fi
          case "$AZURE_HTTP_USER_AGENT" in
            GITHUBACTIONS_DeployFunctionAppToAzure_*) ;;
            *) echo "FAIL: unexpected AZURE_HTTP_USER_AGENT"; exit 1 ;;
          esac
          echo "PASS"
